<!DOCTYPE html>
<html lang="id" class="overflow-x-hidden w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Mutaba'ah Yaumiyah — Premium Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b',950:'#022c22' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: { from: { opacity: '0', transform: 'translateY(10px)' }, to: { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Glassmorphism */
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .dark .glass-panel { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); }

        /* Animasi Checkbox */
        .mutabaah-checkbox svg { transition: all 0.2s ease-in-out; transform: scale(0); opacity: 0; }
        .mutabaah-item.checked .mutabaah-checkbox { background: #10b981; border-color: #10b981; }
        .mutabaah-item.checked .mutabaah-checkbox svg { transform: scale(1); opacity: 1; }
        
        /* Progress Ring */
        .progress-ring-circle { transition: stroke-dashoffset 0.5s ease-in-out; transform-origin: 50% 50%; }

        /* Heatmap (Gaya GitHub) */
        .heatmap-cell { width: 14px; height: 14px; border-radius: 3px; transition: all 0.2s; }
        .heatmap-cell:hover { transform: scale(1.3); z-index: 10; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
        .heatmap-0 { background: #f1f5f9; }
        .heatmap-1 { background: #d1fae5; }
        .heatmap-2 { background: #6ee7b7; }
        .heatmap-3 { background: #10b981; }
        .heatmap-4 { background: #059669; }
        .dark .heatmap-0 { background: #1e293b; }
        .dark .heatmap-1 { background: #064e3b; }
        .dark .heatmap-2 { background: #047857; }
        .dark .heatmap-3 { background: #10b981; }
        .dark .heatmap-4 { background: #34d399; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased min-h-screen transition-colors duration-300 w-full max-w-full">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Main Wrapper -->
    <div class="max-w-6xl mx-auto px-4 md:px-8 py-6 space-y-6 pb-24">
        
        <!-- Header -->
        <header class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <div class="bg-brand-600 text-white p-2.5 rounded-2xl shadow-lg shadow-brand-500/30 flex items-center justify-center w-11 h-11">
                    <i class="fa-solid fa-book-open text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">Mutaba'ah Yaumiyah</h1>
                    <p class="text-[10px] text-brand-600 dark:text-brand-400 font-bold uppercase tracking-widest mt-0.5" id="currentDate">Memuat tanggal...</p>
                </div>
            </div>
            
            <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 shadow-sm transition hover:scale-105">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline"></i>
            </button>
        </header>

        <!-- Dashboard Grid -->
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fade-in">
            
            <!-- KOLOM KIRI: Statistik & Profil (Span 4) -->
            <div class="lg:col-span-4 space-y-6">
                
                <!-- Card Progress Utama -->
                <div class="bg-gradient-to-br from-brand-600 to-brand-800 rounded-3xl p-6 text-white shadow-xl shadow-brand-500/20 relative overflow-hidden flex flex-col justify-between min-h-[240px]">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                    
                    <div class="relative z-10 flex items-start justify-between">
                        <div>
                            <div class="flex items-center gap-2 text-brand-100 font-semibold text-xs uppercase tracking-wider mb-2">
                                <i class="fa-solid fa-fire text-amber-300"></i> Progress Hari Ini
                            </div>
                            <h2 class="text-2xl font-extrabold mt-1" id="userNameDisplay">Hamba Allah</h2>
                        </div>
                        
                        <div class="relative w-20 h-20 shrink-0">
                            <svg class="w-20 h-20 transform -rotate-90">
                                <circle cx="40" cy="40" r="34" stroke="rgba(255,255,255,0.2)" stroke-width="6" fill="none"/>
                                <circle id="mainProgressRing" cx="40" cy="40" r="34" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" class="progress-ring-circle" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <span id="mainProgressText" class="text-sm font-extrabold text-white">0%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Mini Stats -->
                    <div class="relative z-10 mt-6 flex gap-3">
                        <div class="flex-1 bg-white/10 backdrop-blur border border-white/20 rounded-xl p-3 text-center">
                            <div class="text-[10px] text-brand-100 font-semibold uppercase mb-1">Selesai</div>
                            <div class="text-xl font-black" id="statDone">0</div>
                        </div>
                        <div class="flex-1 bg-white/10 backdrop-blur border border-white/20 rounded-xl p-3 text-center">
                            <div class="text-[10px] text-brand-100 font-semibold uppercase mb-1">Tertunda</div>
                            <div class="text-xl font-black" id="statPending">0</div>
                        </div>
                        <div class="flex-1 bg-white/10 backdrop-blur border border-white/20 rounded-xl p-3 text-center">
                            <div class="text-[10px] text-brand-100 font-semibold uppercase mb-1">Streak</div>
                            <div class="text-xl font-black" id="statStreak">0</div>
                        </div>
                    </div>
                </div>

                <!-- Card Pengaturan -->
                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm p-6">
                    <h3 class="text-sm font-extrabold text-slate-900 dark:text-white mb-4">Pengaturan</h3>
                    
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Nama Panggilan</label>
                    <div class="flex gap-2 mb-6">
                        <input type="text" id="inputName" placeholder="Hamba Allah" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:border-brand-500 text-sm font-bold">
                        <button onclick="saveName()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 rounded-xl transition shadow-sm"><i class="fa-solid fa-check"></i></button>
                    </div>

                    <button onclick="resetData()" class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400 font-bold text-xs transition hover:bg-rose-100 dark:hover:bg-rose-900/40">
                        <i class="fa-solid fa-trash"></i> Reset Data Hari Ini
                    </button>
                </div>
            </div>

            <!-- KOLOM KANAN: Amalan & Kalender (Span 8) -->
            <div class="lg:col-span-8 space-y-6">
                
                <!-- Card Amalan -->
                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm p-6 md:p-8">
                    <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                        <div>
                            <h3 class="text-lg font-extrabold text-slate-900 dark:text-white tracking-tight">Amalan Hari Ini</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">15 Amalan Mutaba'ah Yaumiyah</p>
                        </div>
                        <button onclick="completeAll()" class="text-xs font-bold bg-brand-50 text-brand-600 hover:bg-brand-100 px-4 py-2.5 rounded-xl transition border border-brand-200 shadow-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check-double"></i> Centang Semua
                        </button>
                    </div>
                    
                    <div id="mutabaahList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <!-- Diisi via JS -->
                    </div>
                </div>

                <!-- Card Kalender & Heatmap -->
                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">Statistik Konsistensi</h3>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400">Pantau rekam jejak ibadahmu</p>
                        </div>
                        <span class="text-xs font-bold bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-md" id="calendarMonthYear">Memuat...</span>
                    </div>
                    
                    <!-- Heatmap Gaya Github -->
                    <div class="overflow-x-auto pb-4 pt-2">
                        <div id="heatmapContainer" class="flex gap-1 min-w-max"></div>
                        <div class="flex items-center gap-2 mt-4 text-[10px] text-slate-500 dark:text-slate-400">
                            <span>Kurang</span>
                            <div class="flex gap-0.5">
                                <div class="heatmap-cell heatmap-0"></div>
                                <div class="heatmap-cell heatmap-1"></div>
                                <div class="heatmap-cell heatmap-2"></div>
                                <div class="heatmap-cell heatmap-3"></div>
                                <div class="heatmap-cell heatmap-4"></div>
                            </div>
                            <span>Banyak</span>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script>
        // ==========================================
        // 1. DATA & STATE
        // ==========================================
        const STORAGE_KEY = 'mutabaah_v4_data';
        
        const DEFAULT_AMALAN = [
            "Qiyamullail", "Shalat Witir", "Tilawah Al-Qur'an 1 Juz", "Baca Terjemah Al-Qur'an", 
            "Mendo'akan Palestina", "Mendo'akan Qiyadah & Jamaah PKS", "Istighfar 100x", 
            "Shalawat 100x", "Infaq", "Shalat Dhuha", "Shalat Shubuh Berjamaah", 
            "Shalat Dzuhur Berjamaah", "Shalat Ashar Berjamaah", "Shalat Maghrib Berjamaah", "Shalat Isya Berjamaah"
        ];

        let state = {
            name: 'Hamba Allah',
            theme: 'light',
            lastDate: '',
            amalan: [],
            history: {} // Format: { "2026-11-13": { done: 10, total: 15 } }
        };

        // ==========================================
        // 2. LOGIKA UTAMA & STORAGE
        // ==========================================
        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function loadState() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                state = { ...state, ...JSON.parse(raw) };
            }
            
            const today = getTodayKey();
            if (state.lastDate !== today || !state.amalan || state.amalan.length === 0) {
                state.amalan = DEFAULT_AMALAN.map(text => ({ text, done: false }));
                state.lastDate = today;
            }
            
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                state.theme = 'dark';
            } else {
                document.documentElement.classList.remove('dark');
                state.theme = 'light';
            }
            
            saveState();
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // ==========================================
        // 3. RENDER FUNCTIONS
        // ==========================================
        function renderHeader() {
            const days = ['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
            const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            const now = new Date();
            document.getElementById('currentDate').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
            document.getElementById('userNameDisplay').textContent = state.name;
            document.getElementById('inputName').value = state.name;
            document.getElementById('calendarMonthYear').textContent = `${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        function renderMutabaah() {
            const list = document.getElementById('mutabaahList');
            
            list.innerHTML = state.amalan.map((a, i) => `
                <div class="mutabaah-item ${a.done ? 'checked' : ''} flex items-center justify-between p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 cursor-pointer transition hover:border-brand-500" onclick="toggleAmalan(${i})">
                    <span class="text-[13px] font-semibold text-slate-700 dark:text-slate-300 pr-2 ${a.done ? 'line-through opacity-50' : ''}">${a.text}</span>
                    <div class="mutabaah-checkbox w-6 h-6 rounded-md border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0 transition-colors">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>
            `).join('');
            
            updateProgressAndStats();
        }

        function updateProgressAndStats() {
            const total = state.amalan.length;
            const done = state.amalan.filter(a => a.done).length;
            const percent = total ? Math.round((done / total) * 100) : 0;

            // Update UI
            document.getElementById('mainProgressText').textContent = percent + '%';
            document.getElementById('statDone').textContent = done;
            document.getElementById('statPending').textContent = total - done;

            const ring = document.getElementById('mainProgressRing');
            const circumference = 2 * Math.PI * 34;
            ring.style.strokeDashoffset = circumference - (percent / 100) * circumference;

            // Hitung Streak & Simpan History
            state.history[state.lastDate] = { done, total };
            saveState();
            
            const streak = calculateStreak();
            document.getElementById('statStreak').textContent = streak;

            renderHeatmap();
        }

        function calculateStreak() {
            let streak = 0;
            const today = new Date();
            // Cek mundur 30 hari ke belakang
            for (let i = 0; i < 30; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                
                const h = state.history[key];
                // Jika hari ini 50% ke atas, streak lanjut
                if (h && h.total > 0 && (h.done / h.total) >= 0.5) {
                    streak++;
                } else if (i > 0) { // Jika hari kemarin tidak memenuhi syarat, putus streak
                    break; 
                }
            }
            return streak;
        }

        function renderHeatmap() {
            const container = document.getElementById('heatmapContainer');
            if (!container) return;
            
            let html = '';
            // Tampilkan 30 hari terakhir
            const today = new Date();
            
            for (let i = 29; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                
                let level = 0;
                const h = state.history[key];
                if (h && h.total > 0) {
                    const ratio = h.done / h.total;
                    if (ratio > 0.8) level = 4;      // Hijau Tua
                    else if (ratio > 0.5) level = 3; // Hijau
                    else if (ratio > 0.2) level = 2; // Hijau Muda
                    else if (ratio > 0) level = 1;   // Hijau Pucat
                }

                // Format tanggal untuk tooltip
                const tgl = d.getDate();
                const bln = d.toLocaleDateString('id-ID', { month: 'short' });
                
                html += `<div class="heatmap-cell heatmap-${level}" title="${tgl} ${bln} - ${h ? h.done+'/'+h.total+' Amalan' : 'Belum ada data'}"></div>`;
            }
            container.innerHTML = html;
        }

        // ==========================================
        // 4. ACTIONS (INTERAKSI)
        // ==========================================
        function toggleAmalan(index) {
            if (navigator.vibrate) navigator.vibrate(50);
            state.amalan[index].done = !state.amalan[index].done;
            saveState();
            renderMutabaah();
            
            if (state.amalan.every(a => a.done)) {
                showToast('Masya Allah! Semua amalan hari ini selesai! 🎉', 'success');
                fireConfetti();
            }
        }

        function completeAll() {
            const allDone = state.amalan.every(a => a.done);
            state.amalan.forEach(a => a.done = !allDone);
            saveState();
            renderMutabaah();
            if (!allDone) {
                showToast('Semua amalan dicentang!', 'success');
                fireConfetti();
            }
        }

        function saveName() {
            const val = document.getElementById('inputName').value.trim();
            if (val) {
                state.name = val;
                saveState();
                renderHeader();
                showToast('Nama berhasil diperbarui', 'success');
            }
        }

        function resetData() {
            if (confirm('Reset semua centang amalan hari ini?')) {
                state.amalan = DEFAULT_AMALAN.map(text => ({ text, done: false }));
                // Hapus history hari ini
                delete state.history[state.lastDate];
                saveState();
                renderMutabaah();
                showToast('Data hari ini direset', 'info');
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // ==========================================
        // 5. UTILITIES
        // ==========================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast pointer-events-auto min-w-[250px] p-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-bold border-l-4 ${
                type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-500 dark:bg-emerald-900/90 dark:text-emerald-100' : 
                'bg-blue-50 text-blue-800 border-blue-500 dark:bg-blue-900/90 dark:text-blue-100'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function fireConfetti() {
            const colors = ['#10b981','#f59e0b','#3b82f6','#ec4899','#8b5cf6'];
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.style.position = 'fixed'; c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px';
                c.style.width = '10px'; c.style.height = '10px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.zIndex = '9999'; c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0'; c.style.pointerEvents = 'none';
                document.body.appendChild(c);
                const duration = 2000 + Math.random() * 2000;
                c.animate([{ transform: `translateY(0) rotate(0deg)`, opacity: 1 }, { transform: `translateY(100vh) rotate(${720}deg)`, opacity: 0 }], { duration, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' });
                setTimeout(() => c.remove(), duration);
            }
        }

        // ==========================================
        // 6. INISIALISASI
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderHeader();
            renderMutabaah();
        });
    </script>
</body>
</html>
