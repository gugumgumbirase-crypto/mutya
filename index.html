    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANO_XFRAfVCRJSh_PyX8ECF1VEfViTIiM",
            authDomain: "laporan-odoj.firebaseapp.com",
            databaseURL: "https://laporan-odoj-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "laporan-odoj",
            storageBucket: "laporan-odoj.firebasestorage.app",
            messagingSenderId: "779857679768",
            appId: "1:779857679768:web:020c68dcdc8b28006107ed",
            measurementId: "G-36MT1PG4BC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'odoj_data');

        const BULAN_LIST = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
        let ANGGOTA = ["Daman","Dendi","Gugum","Risyad","Rojak"];
        const AUTH_KEY = 'ODOJ_SESSION';
        
        const MUTABAAH_LIST = [
            "Qiyamullail", "Shalat Witir", "Tilawah Al-Qur'an 1 Juz", "Baca Terjemah Al-Qur'an", 
            "Mendo'akan Palestina", "Mendo'akan Qiyadah & Jamaah PKS", "Istighfar 100x", 
            "Shalawat 100x", "Infaq", "Shalat Dhuha", "Shalat Shubuh Berjamaah di Masjid", 
            "Shalat Dzuhur Berjamaah di Masjid", "Shalat Ashar Berjamaah di Masjid", 
            "Shalat Maghrib Berjamaah di Masjid", "Shalat Isya Berjamaah di Masjid"
        ];

        const ICONS = {
            check: `<svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`,
            progress: `<svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
            bookmark: `<svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>`,
            droplet: `<svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>`,
            x: `<svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`,
            trash: `<svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`
        };

        const STATUS = [
            { id:'kholas',        label:'Kholas 1 Juz',        icon: ICONS.check,     color:'#059669' },
            { id:'progress',      label:'In Progress',         icon: ICONS.progress,  color:'#d97706' },
            { id:'tidak-laporan', label:'Tidak Laporan',       icon: ICONS.bookmark,  color:'#db2777' },
            { id:'kurang',        label:'Kurang 1 Juz',        icon: ICONS.droplet,   color:'#475569' },
            { id:'tidak-tilawah', label:'Tidak Tilawah',       icon: ICONS.x,         color:'#dc2626' },
        ];

        // State
        let tilawahStartDate = '';
        let tilawahEndDate = '';
        let mutabaahStartDate = '';
        let mutabaahEndDate = '';
        let selectedBulan = new Date().getMonth();
        let selectedTahun = new Date().getFullYear();
        let selectedNama = ANGGOTA[0];
        let currentUser = null; 
        let dataStore = {};
        let pinStore = {}; 
        let mutabaahStore = {};
        let activeEditDay = null;
        let currentMutabaahDate = '';
        let chartDonut, chartBar;
        let searchQuery = '';

        const getDaysInMonth = (m,y) => new Date(y, m+1, 0).getDate();
        const getKey = () => `${selectedTahun}-${String(selectedBulan+1).padStart(2,'0')}`;
        const getMonthKey = (nama) => `${getKey()}|${nama}`;

        function getAvatar(nama) {
            const colors = ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316'];
            const hash = nama.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const color = colors[hash % colors.length];
            const initial = nama.charAt(0).toUpperCase();
            return `<div class="avatar" style="background:${color}">${initial}</div>`;
        }

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icons = {
                success: '<svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>',
                error: '<svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>',
                warning: '<svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>',
                info: '<svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
            };
            toast.innerHTML = `${icons[type] || icons.info}<span class="flex-1">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 200);
            }, duration);
        }

        function haptic(pattern = [10]) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        function fireConfetti() {
            const colors = ['#10b981','#f59e0b','#3b82f6','#ec4899','#8b5cf6'];
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-10px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                c.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(c);
                const duration = 2000 + Math.random() * 2000;
                c.animate([
                    { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
                    { transform: `translateY(100vh) rotate(${720}deg)`, opacity: 0 }
                ], { duration, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' });
                setTimeout(() => c.remove(), duration);
            }
        }

        function initFirebaseSync() {
            onValue(dbRef, (snapshot) => {
                const cloudData = snapshot.val();
                if (cloudData) {
                    if (cloudData.anggota) ANGGOTA = cloudData.anggota;
                    if (cloudData.tilawah) dataStore = cloudData.tilawah;
                    if (cloudData.mutabaah) mutabaahStore = cloudData.mutabaah;
                    if (cloudData.pins) pinStore = cloudData.pins; 
                }
                
                document.getElementById('skeletonLoader').classList.add('hidden');
                document.getElementById('actualContent').classList.remove('hidden');

                populateFilters();
                populateRekapFilters();
                renderAll();
                if (!document.getElementById('section-mutabaah').classList.contains('hidden')) {
                    initMutabaahDateInput();
                }
            }, (error) => {
                console.error("Gagal membaca database:", error);
                showToast("Gagal terhubung ke database.", 'error', 5000);
                document.getElementById('skeletonLoader').innerHTML = '<div class="p-8 text-center text-rose-500 font-bold">Gagal memuat data. Periksa koneksi internet.</div>';
            });
        }

        function saveData() {
            const payload = { anggota: ANGGOTA, tilawah: dataStore, mutabaah: mutabaahStore, pins: pinStore };
            set(dbRef, payload).catch((error) => {
                console.error("Gagal menyimpan:", error);
                showToast("Gagal menyimpan ke cloud", 'error');
            });
        }

        function getRecord(nama, day) {
            const key = getMonthKey(nama);
            return (dataStore[key] && dataStore[key][day]) ? dataStore[key][day] : null;
        }
        
        function setRecord(nama, day, statusId) {
            const key = getMonthKey(nama);
            if(!dataStore[key]) dataStore[key] = {};
            dataStore[key][day] = { status: statusId, updatedAt: Date.now() };
            saveData();
        }
        
        function removeRecord(nama, day) {
            const key = getMonthKey(nama);
            if(dataStore[key]) { delete dataStore[key][day]; saveData(); }
        }

        // ==================== AUTH (MULTI-USER) ====================
        function checkAuth() {
            const session = localStorage.getItem(AUTH_KEY);
            if (session) {
                try { currentUser = JSON.parse(session); } catch { currentUser = null; }
            }
            
            const btnChangePin = document.getElementById('btnChangePin');
            const menuDesktopMutabaah = document.getElementById('menu-mutabaah');
            const menuMobileMutabaah = document.getElementById('mobile-menu-mutabaah');
            const cardRekapMutabaah = document.getElementById('card-rekap-mutabaah');
            const fab = document.getElementById('fabQuickLog');
            
            // Elemen UI yang menampilkan nama
            const sidebarUserName = document.getElementById('sidebarUserName');
            const mobileAuthText = document.getElementById('mobile-auth-text');

            if (currentUser) {
                if(sidebarUserName) sidebarUserName.textContent = currentUser.role === 'admin' ? 'Admin Utama' : currentUser.nama;
                if(mobileAuthText) mobileAuthText.textContent = currentUser.role === 'admin' ? 'Admin' : currentUser.nama;
                
                if(btnChangePin) btnChangePin.classList.remove('hidden-menu');
                menuDesktopMutabaah.classList.remove('hidden-menu');
                menuDesktopMutabaah.classList.add('flex');
                menuMobileMutabaah.classList.remove('hidden-menu');
                menuMobileMutabaah.classList.add('flex');
                cardRekapMutabaah.classList.remove('hidden-menu');
                if (fab) fab.classList.remove('hidden');
            } else {
                if(sidebarUserName) sidebarUserName.textContent = 'Tamu';
                if(mobileAuthText) mobileAuthText.textContent = 'Login';
                
                if(btnChangePin) btnChangePin.classList.add('hidden-menu');
                menuDesktopMutabaah.classList.add('hidden-menu');
                menuDesktopMutabaah.classList.remove('flex');
                menuMobileMutabaah.classList.add('hidden-menu');
                menuMobileMutabaah.classList.remove('flex');
                cardRekapMutabaah.classList.add('hidden-menu');
                if (fab) fab.classList.add('hidden');
                
                const isMutabaahActive = !document.getElementById('section-mutabaah').classList.contains('hidden');
                if (isMutabaahActive) switchSection('section-harian', 'harian');
            }
        }

        function handleAuthClick() {
            if (currentUser) {
                if(confirm('Yakin ingin logout?')) {
                    localStorage.removeItem(AUTH_KEY);
                    currentUser = null;
                    checkAuth();
                    renderRekapDanKPI();
                    showToast('Berhasil logout', 'info');
                }
            } else {
                const loginNama = document.getElementById('loginNama');
                loginNama.innerHTML = ANGGOTA.map(n => `<option value="${n}">${n}</option>`).join('') + `<option value="ADMIN">-- Admin --</option>`;
                document.getElementById('loginModal').classList.remove('hidden');
                document.getElementById('loginPassword').value = '';
                setTimeout(() => document.getElementById('loginPassword').focus(), 100);
            }
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function handleLogin() {
            const nama = document.getElementById('loginNama').value;
            const pass = document.getElementById('loginPassword').value;
            
            if (nama === 'ADMIN') {
                if (pass === 'adminodoj') {
                    currentUser = { nama: 'Admin', role: 'admin' };
                } else {
                    showToast('PIN Admin salah!', 'error');
                    haptic([50, 30, 50]);
                    return;
                }
            } else {
                // Cek apakah user sudah punya custom PIN, jika belum pakai default 123456
                const userPin = pinStore[nama] || '123456';
                if (pass === userPin) {
                    currentUser = { nama: nama, role: 'member' };
                    selectedNama = nama;
                } else {
                    showToast('PIN salah!', 'error');
                    haptic([50, 30, 50]);
                    return;
                }
            }

            localStorage.setItem(AUTH_KEY, JSON.stringify(currentUser));
            checkAuth();
            closeLoginModal();
            renderAll();
            showToast(`Selamat datang, ${currentUser.nama}!`, 'success');
        }

        function canEdit(nama) {
            if (!currentUser) return false;
            if (currentUser.role === 'admin') return true;
            return currentUser.nama === nama;
        }

        // ==================== MODAL GANTI PIN ====================
        function openChangePinModal() {
            if (!currentUser) return;
            document.getElementById('oldPin').value = '';
            document.getElementById('newPin').value = '';
            document.getElementById('confirmPin').value = '';
            document.getElementById('changePinModal').classList.remove('hidden');
        }

        function closeChangePinModal() {
            document.getElementById('changePinModal').classList.add('hidden');
        }

        function handleChangePin() {
            if (!currentUser) return;
            const oldP = document.getElementById('oldPin').value;
            const newP = document.getElementById('newPin').value;
            const confP = document.getElementById('confirmPin').value;
            
            // Validasi PIN lama (khusus admin statis)
            if (currentUser.role === 'admin') {
                if (oldP !== 'adminodoj') { showToast('PIN Lama salah!', 'error'); return; }
            } else {
                const currentStoredPin = pinStore[currentUser.nama] || '123456';
                if (oldP !== currentStoredPin) { showToast('PIN Lama salah!', 'error'); return; }
            }

            if (newP.length < 4) { showToast('PIN baru minimal 4 karakter', 'warning'); return; }
            if (newP !== confP) { showToast('Konfirmasi PIN tidak cocok', 'warning'); return; }

            if (currentUser.role === 'member') {
                pinStore[currentUser.nama] = newP;
                saveData();
            } else {
                showToast('Admin tidak bisa ganti PIN default di sini.', 'info');
                return;
            }

            closeChangePinModal();
            showToast('PIN berhasil diubah!', 'success');
        }


        // ==================== FILTERS ====================
        function populateFilters() {
            const fn = document.getElementById('filterNama');
            if (!ANGGOTA.includes(selectedNama)) selectedNama = ANGGOTA[0];
            
            const filtered = ANGGOTA.filter(n => n.toLowerCase().includes(searchQuery.toLowerCase()));
            let optionsHtml = filtered.map(n=>`<option value="${n}" ${n===selectedNama?'selected':''}>${n}</option>`).join('');
            if (filtered.length === 0) optionsHtml = `<option value="">Tidak ditemukan</option>`;
            if (currentUser && currentUser.role === 'admin') {
                optionsHtml += `<option value="ADD_NEW" class="font-bold text-brand-600">+ Tambah Anggota</option>`;
            }
            fn.innerHTML = optionsHtml;
        }

        function onSearchChange() {
            searchQuery = document.getElementById('searchInput').value;
            populateFilters();
        }

        function populateRekapFilters() {
            const fb = document.getElementById('filterRekapBulan');
            const ft = document.getElementById('filterRekapTahun');
            if(!fb || !ft) return;
            fb.innerHTML = BULAN_LIST.map((b,i)=>`<option value="${i}" ${i===selectedBulan?'selected':''}>${b}</option>`).join('');
            let years = '';
            for(let y=2024; y<=2030; y++) years += `<option value="${y}" ${y===selectedTahun?'selected':''}>${y}</option>`;
            ft.innerHTML = years;
        }

        function syncTilawahDateInputs() {
            const startInput = document.getElementById('tilawahStartDate');
            const endInput = document.getElementById('tilawahEndDate');
            if (!startInput || !endInput) return;
            const totalHari = getDaysInMonth(selectedBulan, selectedTahun);
            const firstDay = `${selectedTahun}-${String(selectedBulan+1).padStart(2,'0')}-01`;
            const lastDay = `${selectedTahun}-${String(selectedBulan+1).padStart(2,'0')}-${totalHari}`;
            startInput.min = firstDay; startInput.max = lastDay;
            endInput.min = firstDay; endInput.max = lastDay;
            if (!tilawahStartDate || !tilawahStartDate.startsWith(`${selectedTahun}-${String(selectedBulan+1).padStart(2,'0')}`)) tilawahStartDate = firstDay;
            if (!tilawahEndDate || !tilawahEndDate.startsWith(`${selectedTahun}-${String(selectedBulan+1).padStart(2,'0')}`)) tilawahEndDate = lastDay;
            startInput.value = tilawahStartDate;
            endInput.value = tilawahEndDate;
        }

        function onTilawahRangeChange() {
            tilawahStartDate = document.getElementById('tilawahStartDate').value;
            tilawahEndDate = document.getElementById('tilawahEndDate').value;
            if (tilawahStartDate > tilawahEndDate) {
                tilawahEndDate = tilawahStartDate;
                document.getElementById('tilawahEndDate').value = tilawahEndDate;
            }
            renderRekapDanKPI();
        }

        function syncMutabaahDateInputs() {
            const startInput = document.getElementById('mutabaahStartDate');
            const endInput = document.getElementById('mutabaahEndDate');
            if (!startInput || !endInput) return;
            const totalHari = getDaysInMonth(selectedBulan, selectedTahun);
            const firstDay = `${selectedTahun}-${String(selectedBulan+1).padStart(2,'0')}-01`;
            const lastDay = `${selectedTahun}-${String(selectedBulan+1).padStart(2,'0')}-${totalHari}`;
            startInput.min = firstDay; startInput.max = lastDay;
            endInput.min = firstDay; endInput.max = lastDay;
            if (!mutabaahStartDate || !mutabaahStartDate.startsWith(`${selectedTahun}-${String(selectedBulan+1).padStart(2,'0')}`)) mutabaahStartDate = firstDay;
            if (!mutabaahEndDate || !mutabaahEndDate.startsWith(`${selectedTahun}-${String(selectedBulan+1).padStart(2,'0')}`)) mutabaahEndDate = lastDay;
            startInput.value = mutabaahStartDate;
            endInput.value = mutabaahEndDate;
        }

        function onMutabaahRangeChange() {
            mutabaahStartDate = document.getElementById('mutabaahStartDate').value;
            mutabaahEndDate = document.getElementById('mutabaahEndDate').value;
            if (mutabaahStartDate > mutabaahEndDate) {
                mutabaahEndDate = mutabaahStartDate;
                document.getElementById('mutabaahEndDate').value = mutabaahEndDate;
            }
            renderRekapDanKPI();
        }

        function onFilterRekapChange() {
            selectedBulan = parseInt(document.getElementById('filterRekapBulan').value);
            selectedTahun = parseInt(document.getElementById('filterRekapTahun').value);
            renderAll();
        }

        function onFilterChange() {
            const val = document.getElementById('filterNama').value;
            if (val === 'ADD_NEW') {
                const newName = prompt("Masukkan nama anggota baru:");
                if (newName && newName.trim() !== '') {
                    const cleanName = newName.trim();
                    if (!ANGGOTA.includes(cleanName)) {
                        ANGGOTA.push(cleanName);
                        saveData();
                        selectedNama = cleanName;
                        populateFilters();
                        renderAll();
                        initMutabaahDateInput();
                        showToast(`${cleanName} ditambahkan`, 'success');
                    } else { showToast("Nama sudah ada", 'warning'); }
                }
                document.getElementById('filterNama').value = selectedNama;
            } else {
                if (currentUser && currentUser.role === 'member' && val !== currentUser.nama) {
                    showToast('Anda hanya bisa mengedit data sendiri.', 'warning');
                    document.getElementById('filterNama').value = currentUser.nama;
                    return;
                }
                selectedNama = val;
                renderAll();
                initMutabaahDateInput();
            }
        }

        // ==================== NAVIGATION ====================
        function switchSection(sectionId, menuId) {
            if ((sectionId === 'section-mutabaah') && !currentUser) {
                handleAuthClick();
                return;
            }

            ['section-harian', 'section-mutabaah', 'section-rekap', 'section-stats'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.classList.add('hidden'); el.classList.remove('fade-in'); }
            });
            
            const activeEl = document.getElementById(sectionId);
            if (!activeEl) return;
            
            if (document.startViewTransition) {
                document.startViewTransition(() => {
                    activeEl.classList.remove('hidden');
                    activeEl.classList.add('fade-in');
                });
            } else {
                activeEl.classList.remove('hidden');
                void activeEl.offsetWidth; 
                activeEl.classList.add('fade-in');
            }
            
            const menus = ['harian', 'mutabaah', 'rekap', 'stats'];
            const activeClass = 'w-full py-3 px-4 rounded-xl transition flex items-center gap-3 bg-white dark:bg-slate-800 text-brand-700 dark:text-brand-300 shadow-sm border border-slate-200 dark:border-slate-700 font-bold text-sm';
            const inactiveClass = 'w-full py-3 px-4 rounded-xl transition flex items-center gap-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 font-semibold text-sm';
            const mobileActive = 'flex flex-col items-center justify-center w-full h-full text-brand-600 dark:text-brand-400 transition-colors duration-200';
            const mobileInactive = 'flex flex-col items-center justify-center w-full h-full text-slate-400 dark:text-slate-500 transition-colors duration-200';

            menus.forEach(m => {
                const elDesktop = document.getElementById(`menu-${m}`);
                const elMobile = document.getElementById(`mobile-menu-${m}`);
                if (elDesktop && !elDesktop.classList.contains('hidden-menu')) {
                    elDesktop.className = m === menuId ? activeClass : inactiveClass;
                    const svg = elDesktop.querySelector('svg');
                    if (svg) svg.classList.toggle('text-brand-500', m === menuId);
                }
                if (elMobile && !elMobile.classList.contains('hidden-menu')) {
                    elMobile.className = m === menuId ? mobileActive : mobileInactive;
                }
            });

            const titles = { 'harian': 'Ikhtisar Tilawah', 'mutabaah': "Mutaba'ah Yaumiyah", 'rekap': 'Rekap & Grafik', 'stats': 'Statistik & Insight' };
            const pageTitleEl = document.getElementById('page-title');
            if(pageTitleEl) pageTitleEl.textContent = titles[menuId] || '';
            
            if (menuId === 'mutabaah') initMutabaahDateInput();
            if (menuId === 'rekap') { populateRekapFilters(); renderRekapDanKPI(); }
            if (menuId === 'stats') renderStats();
        }

        // ==================== DARK MODE ====================
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            if (chartDonut) chartDonut.update();
            if (chartBar) chartBar.update();
        }
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // ==================== PERIOD NAV ====================
        function navigatePeriod(step) {
            let idx = selectedBulan + step;

        function computeStreak(nama) {
            const total = getDaysInMonth(selectedBulan, selectedTahun);
            let streak = 0;
            for (let day = total; day >= 1; day--) {
                const rec = getRecord(nama, day);
                if (rec && rec.status === 'kholas') { streak++; } else if (rec) { break; }
            }
            return streak;
        }

        function getBadge(streak) {
            if (streak >= 30) return '<span class="badge-achievement badge-gold">🏆 30+ Hari</span>';
            if (streak >= 14) return '<span class="badge-achievement badge-silver">🥈 14+ Hari</span>';
            if (streak >= 7) return '<span class="badge-achievement badge-bronze">🥉 7+ Hari</span>';
            return '';
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            if(!grid) return;
            const total = getDaysInMonth(selectedBulan, selectedTahun);
            const firstDayIndex = new Date(selectedTahun, selectedBulan, 1).getDay();
            const prevMonth = selectedBulan === 0 ? 11 : selectedBulan - 1;
            const prevYear = selectedBulan === 0 ? selectedTahun - 1 : selectedTahun;
            const prevMonthTotal = getDaysInMonth(prevMonth, prevYear);
            const totalCells = 42;
            let html = '';
            
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const d = prevMonthTotal - i;
                html += `<div class="calendar-cell other-month"><span class="day-num">${d}</span></div>`;
            }
            
            const today = new Date();
            const isCurrentMonth = today.getMonth() === selectedBulan && today.getFullYear() === selectedTahun;
            
            for (let day = 1; day <= total; day++) {
                const rec = getRecord(selectedNama, day);
                const statusObj = rec ? STATUS.find(s => s.id === rec.status) : null;
                const todayClass = (isCurrentMonth && today.getDate() === day) ? 'today' : '';
                let iconHtml = '';
                if (statusObj) { iconHtml = `<span class="status-icon" style="color:${statusObj.color}">${statusObj.icon}</span>`; }
                html += `
                    <div class="calendar-cell ${todayClass}" onclick="openSheet(${day})">
                        <span class="day-num">${day}</span>
                        ${iconHtml}
                    </div>
                `;
            }
            
            const remainingCells = totalCells - (firstDayIndex + total);
            for (let i = 1; i <= remainingCells; i++) {
                html += `<div class="calendar-cell other-month"><span class="day-num">${i}</span></div>`;
            }
            grid.innerHTML = html;
        }

        function renderHeatmap() {
            const container = document.getElementById('heatmapContainer');
            if (!container) return;
            const months = [];
            for (let i = 5; i >= 0; i--) {
                let m = selectedBulan - i;
                let y = selectedTahun;
                while (m < 0) { m += 12; y--; }
                months.push({ m, y });
            }
            let html = '';
            months.forEach(({m, y}) => {
                const total = getDaysInMonth(m, y);
                const key = `${y}-${String(m+1).padStart(2,'0')}`;
                let monthHtml = `<div class="flex flex-col gap-1"><div class="text-[9px] font-bold text-slate-500 dark:text-slate-400 text-center mb-1">${BULAN_LIST[m].slice(0,3)}</div><div class="grid grid-cols-7 gap-0.5">`;
                for (let d = 1; d <= total; d++) {
                    const rec = dataStore[`${key}|${selectedNama}`] && dataStore[`${key}|${selectedNama}`][d];
                    let level = 0;
                    if (rec) {
                        if (rec.status === 'kholas') level = 4;
                        else if (rec.status === 'progress') level = 3;
                        else if (rec.status === 'kurang') level = 2;
                        else level = 1;
                    }
                    monthHtml += `<div class="heatmap-cell heatmap-${level}" title="${d} ${BULAN_LIST[m]} ${y}"></div>`;
                }
                monthHtml += `</div></div>`;
                html += monthHtml;
            });
            container.innerHTML = html;
        }

        // ==================== STATS ====================
        function computeStats(nama) {
            const total = getDaysInMonth(selectedBulan, selectedTahun);
            const stats = { kholas:0, progress:0, 'tidak-laporan':0, kurang:0, 'tidak-tilawah':0 };
            
            let startDay = 1;
            let endDay = total;
            if (tilawahStartDate && tilawahEndDate) {
                startDay = parseInt(tilawahStartDate.split('-')[2]);
                endDay = parseInt(tilawahEndDate.split('-')[2]);
                if (startDay > endDay) { const temp = startDay; startDay = endDay; endDay = temp; }
            }

            for(let day=startDay; day<=endDay; day++){
                const rec = getRecord(nama, day);
                if(rec && stats[rec.status] !== undefined){ stats[rec.status]++; }
            }
            stats.totalHari = endDay - startDay + 1;
            stats.terisi = stats.totalHari - (stats['tidak-laporan'] + stats['tidak-tilawah']); 
            stats.persenKholas = stats.totalHari ? Math.round((stats.kholas/stats.totalHari)*100) : 0;
            return stats;
        }

        function computeMutabaahStatsPerAmalan(nama) {
            const totalHari = getDaysInMonth(selectedBulan, selectedTahun);
            const stats = new Array(MUTABAAH_LIST.length).fill(0);
            
            let startDay = 1;
            let endDay = totalHari;
            if (mutabaahStartDate && mutabaahEndDate) {
                startDay = parseInt(mutabaahStartDate.split('-')[2]);
                endDay = parseInt(mutabaahEndDate.split('-')[2]);
                if (startDay > endDay) { const temp = startDay; startDay = endDay; endDay = temp; }
            }

            for (let day = startDay; day <= endDay; day++) {
                const storeKey = `${getKey()}|${nama}|${day}`;
                const dayData = mutabaahStore[storeKey];
                if (dayData) {
                    MUTABAAH_LIST.forEach((_, index) => {
                        if (dayData[index] === true) stats[index]++;
                    });
                }
            }
            return { stats };
        }

        function renderInsight() {
            const container = document.getElementById('insightContainer');
            if (!container) return;
            
            const dayStats = [0,0,0,0,0,0,0];
            const dayCounts = [0,0,0,0,0,0,0];
            const total = getDaysInMonth(selectedBulan, selectedTahun);
            
            for (let day = 1; day <= total; day++) {
                const rec = getRecord(selectedNama, day);
                const d = new Date(selectedTahun, selectedBulan, day).getDay();
                dayCounts[d]++;
                if (rec && rec.status === 'kholas') dayStats[d]++;
            }
            
            const daysIndo = ["Ahad","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
            let bestDay = 0, bestScore = -1, worstDay = 0, worstScore = 100;
            for (let i = 0; i < 7; i++) {
                const score = dayCounts[i] > 0 ? (dayStats[i] / dayCounts[i]) * 100 : 0;
                if (score > bestScore) { bestScore = score; bestDay = i; }
                if (score < worstScore) { worstScore = score; worstDay = i; }
            }
            
            let prevM = selectedBulan - 1, prevY = selectedTahun;
            if (prevM < 0) { prevM = 11; prevY--; }
            const prevTotal = getDaysInMonth(prevM, prevY);
            let prevKholas = 0;
            const prevKey = `${prevY}-${String(prevM+1).padStart(2,'0')}|${selectedNama}`;
            if (dataStore[prevKey]) {
                for (let d = 1; d <= prevTotal; d++) {
                    if (dataStore[prevKey][d] && dataStore[prevKey][d].status === 'kholas') prevKholas++;
                }
            }
            const currentKholas = computeStats(selectedNama).kholas;
            const diff = currentKholas - prevKholas;
            const diffText = diff > 0 ? `+${diff} hari lebih baik! 📈` : diff < 0 ? `${diff} hari lebih rendah 📉` : `Sama saja ➡️`;
            const diffColor = diff > 0 ? 'text-emerald-300' : diff < 0 ? 'text-rose-300' : 'text-brand-200';

            const { stats: mutStats } = computeMutabaahStatsPerAmalan(selectedNama);
            const totalCentang = mutStats.reduce((a,b) => a+b, 0);
            const maxCentang = MUTABAAH_LIST.length * total;
            const persenMutabaah = maxCentang > 0 ? Math.round((totalCentang / maxCentang) * 100) : 0;

            container.innerHTML = `
                <div class="bg-white/10 backdrop-blur rounded-2xl p-4 border border-white/20">
                    <div class="text-[10px] uppercase tracking-widest text-brand-200 font-bold mb-1">Hari Paling Rajin</div>
                    <div class="text-xl font-extrabold">${daysIndo[bestDay]}</div>
                    <div class="text-xs text-brand-100 mt-1">Rata-rata ${Math.round(bestScore)}% kholas di hari ini.</div>
                </div>
                <div class="bg-white/10 backdrop-blur rounded-2xl p-4 border border-white/20">
                    <div class="text-[10px] uppercase tracking-widest text-brand-200 font-bold mb-1">Hari Perlu Perbaikan</div>
                    <div class="text-xl font-extrabold">${daysIndo[worstDay]}</div>
                    <div class="text-xs text-brand-100 mt-1">Rata-rata hanya ${Math.round(worstScore)}% kholas.</div>
                </div>
                <div class="bg-white/10 backdrop-blur rounded-2xl p-4 border border-white/20">
                    <div class="text-[10px] uppercase tracking-widest text-brand-200 font-bold mb-1">vs Bulan Lalu</div>
                    <div class="text-xl font-extrabold ${diffColor}">${diffText}</div>
                    <div class="text-xs text-brand-100 mt-1">Bulan lalu: ${prevKholas} hari kholas.</div>
                </div>
                <div class="bg-white/10 backdrop-blur rounded-2xl p-4 border border-white/20">
                    <div class="text-[10px] uppercase tracking-widest text-brand-200 font-bold mb-1">Total Mutabaah</div>
                    <div class="text-xl font-extrabold">${totalCentang} <span class="text-sm font-normal text-brand-200">/ ${maxCentang}</span></div>
                    <div class="text-xs text-brand-100 mt-1">Konsistensi mutabaah: ${persenMutabaah}%.</div>
                </div>
            `;
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard');
            if (!container) return;
            const scores = ANGGOTA.map(n => {
                const s = computeStats(n);
                const total = s.kholas * 5 + s.progress * 3 + s.kurang * 1;
                return { nama: n, score: total, kholas: s.kholas, persen: s.persenKholas };
            }).sort((a,b) => b.score - a.score);

            const medals = ['🥇','🥈','🥉'];
            container.innerHTML = scores.map((s, i) => `
                <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700">
                    <div class="w-8 h-8 flex items-center justify-center rounded-full font-bold text-sm ${i < 3 ? 'bg-gradient-to-br from-amber-400 to-amber-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">${i < 3 ? medals[i] : i+1}</div>
                    ${getAvatar(s.nama)}
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-sm text-slate-800 dark:text-slate-200 truncate">${s.nama}</p>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400">${s.kholas} hari kholas • ${s.persen}%</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-extrabold text-brand-600">${s.score}</p>
                        <p class="text-[9px] text-slate-400">poin</p>
                    </div>
                </div>
            `).join('');
        }


        // ==================== SHEET ====================
        function buildSheetOptions() {
            const wrap = document.getElementById('sheetOptions');
            if(!wrap) return;
            wrap.innerHTML = STATUS.map(s => `
                <button onclick="pickStatus('${s.id}')" class="w-full flex items-center gap-4 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700/50 active:scale-[0.98] transition text-left shadow-sm">
                    <span class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style="background:${s.color}20; color:${s.color}">${s.icon}</span>
                    <span class="font-bold text-sm text-slate-800 dark:text-slate-200">${s.label}</span>
                </button>
            `).join('') + `
                <button onclick="pickDelete()" class="w-full flex items-center gap-4 p-4 rounded-2xl border border-rose-200 dark:border-rose-900 bg-rose-50 dark:bg-rose-900/20 hover:bg-rose-100 dark:hover:bg-rose-900/40 active:scale-[0.98] transition text-left mt-2 shadow-sm">
                    <span class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 bg-rose-100 dark:bg-rose-900/50 text-rose-600 dark:text-rose-400">${ICONS.trash}</span>
                    <span class="font-bold text-sm text-rose-700 dark:text-rose-400">Hapus Status</span>
                </button>`;
        }

        function openSheet(day) {
            if (!canEdit(selectedNama)) { showToast('Anda tidak punya akses mengedit ini.', 'error'); return; }
            activeEditDay = day;
            const dateObj = new Date(selectedTahun, selectedBulan, day);
            const daysIndo = ["Ahad","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
            const stEl = document.getElementById('sheetTitle');
            if(stEl) stEl.textContent = `${daysIndo[dateObj.getDay()]}, ${day} ${BULAN_LIST[selectedBulan]} — ${selectedNama}`;
            document.getElementById('sheetOverlay').classList.remove('hidden');
            document.getElementById('bottomSheet').classList.remove('translate-y-full');
            document.body.style.overflow = 'hidden';
            haptic([5]);
        }

        function closeSheet() {
            document.getElementById('sheetOverlay').classList.add('hidden');
            document.getElementById('bottomSheet').classList.add('translate-y-full');
            document.body.style.overflow = '';
            activeEditDay = null;
        }

        function pickStatus(statusId) {
            if(activeEditDay === null) return;
            setRecord(selectedNama, activeEditDay, statusId);
            closeSheet();
            renderAll();
            haptic([10, 20, 10]);
            showToast('Status tersimpan', 'success', 1500);
        }

        function pickDelete() {
            if(activeEditDay === null) return;
            removeRecord(selectedNama, activeEditDay);
            closeSheet();
            renderAll();
            showToast('Status dihapus', 'info', 1500);
        }

        // ==================== EXPORT ====================
        function exportData() {
            const data = { anggota: ANGGOTA, tilawah: dataStore, mutabaah: mutabaahStore, pins: pinStore, exportedAt: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `odoj-backup-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Data berhasil di-export', 'success');
        }

        function exportRekapCSV() {
            let csv = `Nama,Kholas,Progress,Tdk Lapor,Kurang,Tdk Tilawah,Total Hari,Persen Kholas\n`;
            ANGGOTA.forEach(nama => {
                const s = computeStats(nama);
                csv += `${nama},${s.kholas},${s.progress},${s['tidak-laporan']},${s.kurang},${s['tidak-tilawah']},${s.totalHari},${s.persenKholas}%\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rekap-${BULAN_LIST[selectedBulan]}-${selectedTahun}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Rekap CSV berhasil di-download', 'success');
        }

        // ==================== PULL TO REFRESH ====================
        let touchStartY = 0;
        let isPulling = false;
        const mainScroll = document.getElementById('mainScroll');
        const ptrIndicator = document.getElementById('ptrIndicator');
        
        if (mainScroll && ptrIndicator) {
            mainScroll.addEventListener('touchstart', (e) => {
                if (mainScroll.scrollTop === 0) {
                    touchStartY = e.touches[0].clientY;
                    isPulling = true;
                }
            }, { passive: true });
            
            mainScroll.addEventListener('touchmove', (e) => {
                if (!isPulling) return;
                const deltaY = e.touches[0].clientY - touchStartY;
                if (deltaY > 60) {
                    ptrIndicator.classList.add('active');
                }
            }, { passive: true });
            
            mainScroll.addEventListener('touchend', () => {
                if (ptrIndicator.classList.contains('active')) {
                    ptrIndicator.classList.add('refreshing');
                    setTimeout(() => {
                        window.location.reload();
                    }, 500);
                }
                isPulling = false;
            }, { passive: true });
        }

        // ==================== PWA ====================
        let swRegistration = null;
        let refreshing = false;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    swRegistration = reg;
                }).catch(err => console.log('SW registration failed', err));
            });
        }

        // ==================== EXPOSE ====================
        window.handleAuthClick = handleAuthClick;
        window.closeLoginModal = closeLoginModal;
        window.handleLogin = handleLogin;
        window.openChangePinModal = openChangePinModal;
        window.closeChangePinModal = closeChangePinModal;
        window.handleChangePin = handleChangePin;
        window.onFilterChange = onFilterChange;
        window.onSearchChange = onSearchChange;
        window.navigatePeriod = navigatePeriod;
        window.goToToday = goToToday;
        window.toggleDarkMode = toggleDarkMode;
        window.switchSection = switchSection;
        window.openSheet = openSheet;
        window.closeSheet = closeSheet;
        window.pickStatus = pickStatus;
        window.pickDelete = pickDelete;
        window.toggleMutabaah = toggleMutabaah;
        window.completeAllMutabaah = completeAllMutabaah;
        window.quickLogToday = quickLogToday;
        window.onMutabaahDateChange = onMutabaahDateChange;
        window.onFilterRekapChange = onFilterRekapChange;
        window.exportData = exportData;
        window.exportRekapCSV = exportRekapCSV;
        window.navigateMutabaahPeriod = navigateMutabaahPeriod;
        window.onMutabaahRangeChange = onMutabaahRangeChange;
        window.onTilawahRangeChange = onTilawahRangeChange;

        // ==================== INIT ====================
        function init() {
            checkAuth();
            buildSheetOptions();
            renderCalendar();
            renderRekapDanKPI();
            
            const sheetOverlay = document.getElementById('sheetOverlay');
            if(sheetOverlay) sheetOverlay.addEventListener('click', closeSheet);
            
            switchSection('section-harian', 'harian');
            
            initFirebaseSync();
            
            const params = new URLSearchParams(window.location.search);
            const section = params.get('section');
            if (section === 'mutabaah' && currentUser) {
                switchSection('section-mutabaah', 'mutabaah');
            } else if (section === 'rekap') {
                switchSection('section-rekap', 'rekap');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
