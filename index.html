<!DOCTYPE html>
<html lang="id" class="overflow-x-hidden w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Mutaba'ah Yaumiyah — Premium App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b',950:'#022c22' }
                    },
                    animation: { 'fade-in': 'fadeIn 0.4s ease-out' },
                    keyframes: { fadeIn: { from: { opacity: '0', transform: 'translateY(10px)' }, to: { opacity: '1', transform: 'translateY(0)' } } }
                }
            }
        }
    </script>
    
    <!-- FontAwesome, Fonts, Chart.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .dark .glass-panel { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); }

        .mutabaah-checkbox svg { transition: all 0.2s ease-in-out; transform: scale(0); opacity: 0; }
        .mutabaah-item.checked .mutabaah-checkbox { background: #10b981; border-color: #10b981; }
        .mutabaah-item.checked .mutabaah-checkbox svg { transform: scale(1); opacity: 1; }
        
        .progress-ring-circle { transition: stroke-dashoffset 0.5s ease-in-out; transform-origin: 50% 50%; }

        .heatmap-cell { width: 14px; height: 14px; border-radius: 3px; transition: all 0.2s; }
        .heatmap-cell:hover { transform: scale(1.3); z-index: 10; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
        .heatmap-0 { background: #f1f5f9; }
        .heatmap-1 { background: #d1fae5; }
        .heatmap-2 { background: #6ee7b7; }
        .heatmap-3 { background: #10b981; }
        .heatmap-4 { background: #059669; }
        .dark .heatmap-0 { background: #1e293b; }
        .dark .heatmap-1 { background: #064e3b; }
        .dark .heatmap-2 { background: #047857; }
        .dark .heatmap-3 { background: #10b981; }
        .dark .heatmap-4 { background: #34d399; }

        .toast { animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Sembunyikan spinner input date di beberapa browser */
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased min-h-screen transition-colors duration-300 w-full max-w-full">

    <div id="toastContainer" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header Navigasi Atas -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-200/50 dark:border-slate-800/50">
        <div class="max-w-6xl mx-auto px-4 md:px-8 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-brand-600 text-white p-2 rounded-xl shadow-lg shadow-brand-500/30 flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">Mutaba'ah Yaumiyah</h1>
                    <p class="text-[10px] text-brand-600 dark:text-brand-400 font-bold uppercase tracking-widest mt-0.5" id="currentDateDisplay">Memuat...</p>
                </div>
            </div>
            <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 shadow-sm transition hover:scale-105">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline"></i>
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 md:px-8 py-6 space-y-6 pb-24">
        
        <!-- Tab Menu -->
        <div class="flex bg-slate-200/50 dark:bg-slate-800/50 p-1 rounded-2xl w-full max-w-md mx-auto">
            <button onclick="switchTab('amalan')" id="tab-amalan" class="flex-1 py-2.5 text-sm font-bold rounded-xl bg-white dark:bg-slate-900 shadow-sm text-brand-600 dark:text-brand-400 transition-all">Amalan</button>
            <button onclick="switchTab('rekap')" id="tab-rekap" class="flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-all">Rekap & Grafik</button>
        </div>

        <!-- KONTEN: AMALAN -->
        <main id="view-amalan" class="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fade-in">
            
            <!-- Kolom Kiri: Statistik & Profil -->
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-gradient-to-br from-brand-600 to-brand-800 rounded-3xl p-6 text-white shadow-xl shadow-brand-500/20 relative overflow-hidden flex flex-col justify-between min-h-[220px]">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                    
                    <div class="relative z-10 flex items-start justify-between">
                        <div>
                            <div class="flex items-center gap-2 text-brand-100 font-semibold text-xs uppercase tracking-wider mb-2">
                                <i class="fa-solid fa-calendar-day"></i> <span id="amalanDateLabel">Hari Ini</span>
                            </div>
                            <h2 class="text-2xl font-extrabold mt-1" id="userNameDisplay">Hamba Allah</h2>
                        </div>
                        
                        <div class="relative w-20 h-20 shrink-0">
                            <svg class="w-20 h-20 transform -rotate-90">
                                <circle cx="40" cy="40" r="34" stroke="rgba(255,255,255,0.2)" stroke-width="6" fill="none"/>
                                <circle id="mainProgressRing" cx="40" cy="40" r="34" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" class="progress-ring-circle" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <span id="mainProgressText" class="text-sm font-extrabold text-white">0%</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="relative z-10 mt-6 flex gap-3">
                        <div class="flex-1 bg-white/10 backdrop-blur border border-white/20 rounded-xl p-3 text-center">
                            <div class="text-[10px] text-brand-100 font-semibold uppercase mb-1">Selesai</div>
                            <div class="text-xl font-black" id="statDone">0</div>
                        </div>
                        <div class="flex-1 bg-white/10 backdrop-blur border border-white/20 rounded-xl p-3 text-center">
                            <div class="text-[10px] text-brand-100 font-semibold uppercase mb-1">Tertunda</div>
                            <div class="text-xl font-black" id="statPending">0</div>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm p-6">
                    <h3 class="text-sm font-extrabold text-slate-900 dark:text-white mb-4">Pengaturan</h3>
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Nama Panggilan</label>
                    <div class="flex gap-2 mb-6">
                        <input type="text" id="inputName" placeholder="Hamba Allah" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:border-brand-500 text-sm font-bold">
                        <button onclick="saveName()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 rounded-xl transition shadow-sm"><i class="fa-solid fa-check"></i></button>
                    </div>
                </div>
            </div>

            <!-- Kolom Kanan: List Amalan -->
            <div class="lg:col-span-8">
                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm p-6 md:p-8 h-full">
                    
                    <!-- Toolbar Tanggal -->
                    <div class="flex flex-col md:flex-row items-center justify-between mb-6 gap-4 border-b border-slate-100 dark:border-slate-800 pb-6">
                        <div class="flex items-center gap-2">
                            <button onclick="changeDate(-1)" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition"><i class="fa-solid fa-chevron-left"></i></button>
                            
                            <!-- Input Tanggal -->
                            <div class="flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-xl shadow-sm">
                                <i class="fa-regular fa-calendar text-slate-400"></i>
                                <input type="date" id="datePicker" onchange="onDateChange()" class="bg-transparent text-sm font-bold text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer">
                            </div>

                            <button onclick="changeDate(1)" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition"><i class="fa-solid fa-chevron-right"></i></button>
                            
                            <button onclick="goToToday()" class="text-xs font-bold text-brand-600 dark:text-brand-400 hover:underline ml-2 hidden md:block">Hari Ini</button>
                        </div>
                        <div class="text-xs text-slate-500 font-medium bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg" id="infoAmalan">15 Amalan</div>
                    </div>
                    
                    <div id="mutabaahList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <!-- Diisi via JS -->
                    </div>
                </div>
            </div>
        </main>

        <!-- KONTEN: REKAP & GRAFIK -->
        <main id="view-rekap" class="hidden space-y-6 animate-fade-in">
            
            <!-- Card Filter & Tabel -->
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm p-6">
                
                <div class="flex flex-col md:flex-row items-center justify-between mb-6 gap-4">
                    <div>
                        <h2 class="text-lg font-extrabold text-slate-900 dark:text-white">Rekapitulasi Mutaba'ah</h2>
                        <p class="text-xs text-slate-500 mt-1">Pilih rentang tanggal untuk melihat total amalan.</p>
                    </div>
                    <!-- Filter Tanggal Rekap -->
                    <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 shadow-sm text-xs font-bold">
                        <span class="text-slate-400 uppercase">Dari</span>
                        <input type="date" id="rekapStart" onchange="renderRekap()" class="bg-transparent focus:outline-none cursor-pointer">
                        <span class="text-slate-400 uppercase">S/d</span>
                        <input type="date" id="rekapEnd" onchange="renderRekap()" class="bg-transparent focus:outline-none cursor-pointer">
                    </div>
                </div>

                <!-- Tabel Rekap -->
                <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead class="bg-brand-600 text-white text-[11px] uppercase tracking-wider font-extrabold text-center">
                            <tr>
                                <th class="px-4 py-3 border-r border-brand-500/50 sticky left-0 bg-brand-600 z-10 w-[40%] text-left">Nama Amalan</th>
                                <th class="px-4 py-3 border-r border-brand-500/50">Total Selesai</th>
                                <th class="px-4 py-3">Persentase</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-rekap" class="divide-y divide-slate-200 dark:divide-slate-800 text-center text-sm font-medium bg-white dark:bg-slate-900">
                            <!-- Diisi via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Card Grafik Chart.js -->
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm p-6">
                <h3 class="text-sm font-extrabold text-slate-900 dark:text-white mb-6">Grafik Konsistensi</h3>
                <div class="relative h-72 w-full">
                    <canvas id="chartRekap"></canvas>
                </div>
            </div>

        </main>
    </div>

    <script>
        // ==========================================
        // 1. KONFIGURASI & STATE
        // ==========================================
        const STORAGE_KEY = 'mutabaah_v5_data';
        
        const DEFAULT_AMALAN = [
            "Qiyamullail", "Shalat Witir", "Tilawah Al-Qur'an 1 Juz", "Baca Terjemah Al-Qur'an", 
            "Mendo'akan Palestina", "Mendo'akan Qiyadah & Jamaah PKS", "Istighfar 100x", 
            "Shalawat 100x", "Infaq", "Shalat Dhuha", "Shalat Shubuh Berjamaah", 
            "Shalat Dzuhur Berjamaah", "Shalat Ashar Berjamaah", "Shalat Maghrib Berjamaah", "Shalat Isya Berjamaah"
        ];

        let state = {
            name: 'Hamba Allah',
            theme: 'light',
            dailyData: {} // Format: { "2026-11-13": { "Qiyamullail": true, "Infaq": false } }
        };

        let currentDate = new Date(); // Tanggal yang sedang aktif dilihat
        let chartInstance = null;

        // ==========================================
        // 2. UTILITIES & STORAGE
        // ==========================================
        function formatDateKey(dateObj) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
        }

        function loadState() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                state = { ...state, ...JSON.parse(raw) };
            }
            // Setup Tema
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            saveState();
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast pointer-events-auto min-w-[250px] p-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-bold border-l-4 ${
                type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-500 dark:bg-emerald-900/90 dark:text-emerald-100' : 
                'bg-blue-50 text-blue-800 border-blue-500 dark:bg-blue-900/90 dark:text-blue-100'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // ==========================================
        // 3. RENDER UI (AMALAN HARIAN)
        // ==========================================
        function renderAmalan() {
            // Set Tanggal di Input & Header
            const dateKey = formatDateKey(currentDate);
            document.getElementById('datePicker').value = dateKey;
            
            const days = ['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
            
            const isToday = dateKey === formatDateKey(new Date());
            document.getElementById('amalanDateLabel').textContent = isToday ? "Hari Ini" : "Edit Riwayat";
            document.getElementById('currentDateDisplay').textContent = `${days[currentDate.getDay()]}, ${currentDate.getDate()} ${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            document.getElementById('userNameDisplay').textContent = state.name;
            document.getElementById('inputName').value = state.name;

            // Pastikan data untuk hari ini ada di state
            if (!state.dailyData[dateKey]) state.dailyData[dateKey] = {};

            const list = document.getElementById('mutabaahList');
            let doneCount = 0;

            list.innerHTML = DEFAULT_AMALAN.map((text, i) => {
                const isDone = state.dailyData[dateKey][text] === true;
                if (isDone) doneCount++;

                return `
                <div class="mutabaah-item ${isDone ? 'checked' : ''} flex items-center justify-between p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 cursor-pointer transition hover:border-brand-500" onclick="toggleAmalan('${text}')">
                    <span class="text-[13px] font-semibold text-slate-700 dark:text-slate-300 pr-2 ${isDone ? 'line-through opacity-50' : ''}">${text}</span>
                    <div class="mutabaah-checkbox w-6 h-6 rounded-md border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0 transition-colors">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>`;
            }).join('');

            // Update Progress Ring
            const total = DEFAULT_AMALAN.length;
            const percent = Math.round((doneCount / total) * 100);

            document.getElementById('mainProgressText').textContent = percent + '%';
            document.getElementById('statDone').textContent = doneCount;
            document.getElementById('statPending').textContent = total - doneCount;

            const ring = document.getElementById('mainProgressRing');
            const circumference = 2 * Math.PI * 34;
            ring.style.strokeDashoffset = circumference - (percent / 100) * circumference;
        }

        // ==========================================
        // 4. ACTIONS
        // ==========================================
        function toggleAmalan(amalanName) {
            if (navigator.vibrate) navigator.vibrate(50);
            const dateKey = formatDateKey(currentDate);
            
            if (!state.dailyData[dateKey]) state.dailyData[dateKey] = {};
            
            // Toggle logic
            if (state.dailyData[dateKey][amalanName]) {
                delete state.dailyData[dateKey][amalanName];
            } else {
                state.dailyData[dateKey][amalanName] = true;
            }
            
            saveState();
            renderAmalan();
            
            // Cek apakah semua amalan hari itu selesai
            const doneCount = Object.keys(state.dailyData[dateKey]).length;
            if (doneCount === DEFAULT_AMALAN.length) {
                showToast('Masya Allah! Semua amalan selesai! 🎉', 'success');
                fireConfetti();
            }
        }

        function changeDate(offset) {
            currentDate.setDate(currentDate.getDate() + offset);
            renderAmalan();
        }

        function onDateChange() {
            const val = document.getElementById('datePicker').value;
            if (val) {
                currentDate = new Date(val);
                renderAmalan();
            }
        }

        function goToToday() {
            currentDate = new Date();
            renderAmalan();
        }

        function saveName() {
            const val = document.getElementById('inputName').value.trim();
            if (val) {
                state.name = val;
                saveState();
                renderAmalan();
                showToast('Nama diperbarui', 'success');
            }
        }

        // ==========================================
        // 5. REKAP & GRAFIK
        // ==========================================
        function switchTab(tab) {
            const btnAmalan = document.getElementById('tab-amalan');
            const btnRekap = document.getElementById('tab-rekap');
            const viewAmalan = document.getElementById('view-amalan');
            const viewRekap = document.getElementById('view-rekap');

            if (tab === 'amalan') {
                btnAmalan.className = 'flex-1 py-2.5 text-sm font-bold rounded-xl bg-white dark:bg-slate-900 shadow-sm text-brand-600 dark:text-brand-400 transition-all';
                btnRekap.className = 'flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-500 hover:text-slate-700 transition-all';
                viewAmalan.classList.remove('hidden');
                viewRekap.classList.add('hidden');
            } else {
                btnRekap.className = 'flex-1 py-2.5 text-sm font-bold rounded-xl bg-white dark:bg-slate-900 shadow-sm text-brand-600 dark:text-brand-400 transition-all';
                btnAmalan.className = 'flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-500 hover:text-slate-700 transition-all';
                viewAmalan.classList.add('hidden');
                viewRekap.classList.remove('hidden');
                
                // Set default filter tanggal (Awal bulan ini s/d Hari ini)
                const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
                document.getElementById('rekapStart').value = formatDateKey(firstDay);
                document.getElementById('rekapEnd').value = formatDateKey(new Date());
                
                renderRekap();
            }
        }

        function renderRekap() {
            const startStr = document.getElementById('rekapStart').value;
            const endStr = document.getElementById('rekapEnd').value;
            
            if (!startStr || !endStr) return;

            const start = new Date(startStr);
            const end = new Date(endStr);
            
            // Object untuk menyimpan hitungan
            let amalanCounts = {};
            DEFAULT_AMALAN.forEach(a => amalanCounts[a] = 0);
            
            let totalDays = 0;
            let totalCheckedAll = 0; // Untuk grafik

            // Loop dari tanggal start ke end
            let loopDate = new Date(start);
            while (loopDate <= end) {
                const key = formatDateKey(loopDate);
                const dayData = state.dailyData[key];
                
                if (dayData) {
                    let checkedToday = 0;
                    DEFAULT_AMALAN.forEach(amalan => {
                        if (dayData[amalan] === true) {
                            amalanCounts[amalan]++;
                            checkedToday++;
                        }
                    });
                    totalCheckedAll += checkedToday;
                }
                totalDays++;
                loopDate.setDate(loopDate.getDate() + 1);
            }

            // 1. Render Tabel HTML
            const tbody = document.getElementById('tbody-rekap');
            tbody.innerHTML = DEFAULT_AMALAN.map(amalan => {
                const count = amalanCounts[amalan];
                const percent = totalDays > 0 ? Math.round((count / totalDays) * 100) : 0;
                
                // Warna bar persentase
                let barColor = 'bg-slate-200 dark:bg-slate-700';
                if (percent > 70) barColor = 'bg-brand-500';
                else if (percent > 40) barColor = 'bg-amber-400';

                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                        <td class="px-4 py-3 text-left font-bold text-slate-700 dark:text-slate-300 sticky left-0 bg-white dark:bg-slate-900">${amalan}</td>
                        <td class="px-4 py-3 font-extrabold text-brand-600 dark:text-brand-400">${count} <span class="text-xs font-normal text-slate-400">/ ${totalDays} hr</span></td>
                        <td class="px-4 py-3">
                            <div class="flex items-center gap-2">
                                <div class="flex-1 h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                    <div class="${barColor} h-full rounded-full" style="width: ${percent}%"></div>
                                </div>
                                <span class="text-xs font-bold w-8 text-right">${percent}%</span>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            // 2. Render Grafik Chart.js
            renderChart(amalanCounts, totalDays);
        }

        function renderChart(counts, totalDays) {
            const ctx = document.getElementById('chartRekap').getContext('2d');
            
            // Jika chart sudah ada, hancurkan dulu
            if (chartInstance) chartInstance.destroy();

            const labels = DEFAULT_AMALAN.map(a => a.length > 20 ? a.substring(0, 18) + '...' : a);
            const dataValues = DEFAULT_AMALAN.map(a => counts[a]);

            // Custom plugin untuk menampilkan angka di atas batang
            const barLabelPlugin = {
                id: 'barLabelPlugin',
                afterDatasetsDraw(chart) {
                    const { ctx } = chart;
                    ctx.save();
                    chart.data.datasets.forEach((dataset, i) => {
                        const meta = chart.getDatasetMeta(i);
                        if (meta.hidden) return;
                        meta.data.forEach((bar, index) => {
                            const value = dataset.data[index];
                            if (value > 0) {
                                ctx.fillStyle = '#64748b'; // Warna teks
                                ctx.font = 'bold 10px Plus Jakarta Sans';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'bottom';
                                ctx.fillText(value, bar.x, bar.y - 4);
                            }
                        });
                    });
                    ctx.restore();
                }
            };

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Selesai',
                        data: dataValues,
                        backgroundColor: 'rgba(16, 185, 129, 0.8)',
                        borderColor: '#059669',
                        borderWidth: 1,
                        borderRadius: 4,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (context) => DEFAULT_AMALAN[context[0].dataIndex],
                                label: (context) => `Selesai: ${context.parsed.y} dari ${totalDays} hari`
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            suggestedMax: totalDays,
                            ticks: {
                                precision: 0,
                                stepSize: Math.ceil(totalDays / 5) || 1,
                                color: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b'
                            },
                            grid: { color: document.documentElement.classList.contains('dark') ? '#334155' : '#e2e8f0' }
                        },
                        x: {
                            ticks: {
                                color: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b',
                                font: { size: 9 },
                                maxRotation: 45,
                                minRotation: 45
                            },
                            grid: { display: false }
                        }
                    }
                },
                plugins: [barLabelPlugin]
            });
        }

        // ==========================================
        // 6. FUNGSI LAINNYA
        // ==========================================
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            // Re-render chart agar warna teks/garis menyesuaikan tema
            if (!document.getElementById('view-rekap').classList.contains('hidden')) {
                renderRekap();
            }
        }

        function fireConfetti() {
            const colors = ['#10b981','#f59e0b','#3b82f6','#ec4899','#8b5cf6'];
            for (let i = 0; i < 40; i++) {
                const c = document.createElement('div');
                c.style.position = 'fixed'; c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px';
                c.style.width = '10px'; c.style.height = '10px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.zIndex = '9999'; c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0'; c.style.pointerEvents = 'none';
                document.body.appendChild(c);
                const duration = 2000 + Math.random() * 2000;
                c.animate([{ transform: `translateY(0) rotate(0deg)`, opacity: 1 }, { transform: `translateY(100vh) rotate(${720}deg)`, opacity: 0 }], { duration, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' });
                setTimeout(() => c.remove(), duration);
            }
        }

        // ==========================================
        // 7. INISIALISASI
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderAmalan();
        });
    </script>
</body>
</html>
